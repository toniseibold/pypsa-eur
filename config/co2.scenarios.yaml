endogenous:
  carrier_networks:
    CO2:
      enable: true
      include:
        greenfield: true
        pcipmi: false
    H2:
      enable: true
      include:
        greenfield: true
        pcipmi: false
  pcipmi_projects:
    enable: false

frozen_H2_29:
  carrier_networks:
    CO2:
      enable: true
      include:
        greenfield: true
        pcipmi: true
      options:
        cost_factor: 1.0
        length_factor: 1.0
        delay: 6
    H2:
      enable: true
      include:
        greenfield: false
        pcipmi: true
      extendable:
        greenfield: []
        pcipmi: []
      p_nom_max: .inf
      options:
        delay: 6
  pcipmi_projects:
    enable: true
    include:
      - stores_co2
      - stores_h2
    options:
      delay: 6

no_co2_network:
  carrier_networks:
    CO2:
      enable: false
      include:
        greenfield: false
        pcipmi: false

onshore_seq_endo:
  carrier_networks:
    CO2:
      enable: true
      include:
        greenfield: true
        pcipmi: false
    H2:
      enable: true
      include:
        greenfield: true
        pcipmi: false
  sector:
    regional_co2_sequestration_potential:
      enable: true
      attribute:
      - optimistic estimate Mt
      - optimistic estimate GAS Mt
      - optimistic estimate OIL Mt
      - optimistic estimate aquifer Mt
      include_onshore: true
      min_size: 3
      max_size: .inf # 25
      years_of_storage: 25

pcipmi:
  carrier_networks:
    CO2:
      enable: true
      include:
        greenfield: true
        pcipmi: true
      extendable:
        greenfield: ['national', 'international']
        pcipmi: []
      p_nom_max: .inf
      options:
        cost_factor: 1.0
        length_factor: 1.0
        delay: 0
    H2:
      enable: true
      include:
        greenfield: true
        pcipmi: true
      extendable:
        greenfield: ['national', 'international']
        pcipmi: []
      p_nom_max: .inf
      options:
        delay: 0

seq_50:
  sector:
    co2_sequestration_potential:
      2030: 20
      2040: 90
      2050: 250
